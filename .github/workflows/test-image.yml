name: Test Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Image target to build"
        required: true
        default: server
        type: choice
        options:
          - server
          - scheduler
          - worker
      image_tag:
        description: "Docker image tag for testing"
        required: true
        default: test
      run_tests:
        description: "Run Go tests before building the image"
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target }}-${{ github.event.inputs.image_tag }}
  cancel-in-progress: true

jobs:
  build-test-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        if: ${{ inputs.run_tests }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        if: ${{ inputs.run_tests }}
        run: go test -timeout 5m -count=1 ./...

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image settings
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag: ${IMAGE_TAG}"
            exit 1
          fi

          case "${TARGET}" in
            server)
              echo "build_target=cmd/server" >> "${GITHUB_OUTPUT}"
              echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/go-template-server" >> "${GITHUB_OUTPUT}"
              ;;
            scheduler)
              echo "build_target=cmd/scheduler" >> "${GITHUB_OUTPUT}"
              echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/go-template-scheduler" >> "${GITHUB_OUTPUT}"
              ;;
            worker)
              echo "build_target=cmd/worker" >> "${GITHUB_OUTPUT}"
              echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/go-template-worker" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unsupported target: ${TARGET}"
              exit 1
              ;;
          esac

          echo "tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: TARGET=${{ steps.image.outputs.build_target }}
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:test-${{ github.sha }}
