name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v0.1.0)"
        required: true

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release context
        id: release-context
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -timeout 5m -count=1 ./...

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/go-template-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release-context.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release-context.outputs.tag }}
            type=raw,value=latest

      - name: Docker metadata (scheduler)
        id: meta-scheduler
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/go-template-scheduler
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release-context.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release-context.outputs.tag }}
            type=raw,value=latest

      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: TARGET=cmd/server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Build and push scheduler
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: TARGET=cmd/scheduler
          push: true
          tags: ${{ steps.meta-scheduler.outputs.tags }}
          labels: ${{ steps.meta-scheduler.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-context.outputs.tag }}
          generate_release_notes: true
