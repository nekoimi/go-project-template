basePath: /v1
definitions:
  model.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/model.UserInfo'
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 50
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  model.UserInfo:
    properties:
      created_at:
        $ref: '#/definitions/timeutil.LocalTime'
      email:
        type: string
      id:
        example: "1234567890123456789"
        type: string
      username:
        type: string
    type: object
  model.UserResponse:
    properties:
      created_at:
        $ref: '#/definitions/timeutil.LocalTime'
      email:
        type: string
      id:
        example: "1234567890123456789"
        type: string
      updated_at:
        $ref: '#/definitions/timeutil.LocalTime'
      username:
        type: string
    type: object
  resp.JsonResponse:
    properties:
      code:
        type: integer
      data: {}
      error: {}
      msg:
        type: string
    type: object
  timeutil.LocalTime:
    properties:
      time.Time:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A Go backend template project.
  title: Go Template API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/resp.JsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/resp.JsonResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.JsonResponse'
      summary: User login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/resp.JsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/resp.JsonResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/resp.JsonResponse'
      summary: Register a new user
      tags:
      - auth
  /upload/multiple:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - collectionFormat: csv
        description: Files to upload
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      - description: Upload folder
        in: formData
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.JsonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/resp.JsonResponse'
      security:
      - BearerAuth: []
      summary: Upload multiple files
      tags:
      - upload
  /upload/single:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Upload folder
        in: formData
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resp.JsonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/resp.JsonResponse'
      security:
      - BearerAuth: []
      summary: Upload a single file
      tags:
      - upload
  /users/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/resp.JsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/resp.JsonResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/resp.JsonResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
