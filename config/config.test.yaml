server:
  enabled: true
  port: "8081"
  mode: debug
  shutdown_timeout: 10
  read_timeout: 2m
  read_header_timeout: 10s
  write_timeout: 2m
  idle_timeout: 60s

database:
  host: localhost
  port: "5432"
  user: postgres
  password: postgres
  dbname: go_template_test
  sslmode: disable
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 10
  connect_timeout: 5s

jwt:
  secret: "test-secret"
  expire_hours: 1

scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  leader_election: true
  leader_key: "go-project-template:scheduler:leader"
  leader_ttl: 15s

task_queue:
  enabled: false

modules:
  auth:
    enabled: true
  user:
    enabled: true
  upload:
    enabled: true
  websocket:
    enabled: true
  example_job:
    enabled: true

websocket:
  enabled: false
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_period: 60s
  write_wait: 10s
  read_wait: 60s
  max_message_size: 5120

storage:
  driver: "local"
  base_url: "http://localhost:8081/uploads"
  upload:
    max_file_size: 5
    max_request_size: 20
    max_files: 5
  local:
    upload_dir: "./test-uploads"
  s3:
    provider: "minio"
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "go-template-test"
    region: "us-east-1"
    use_ssl: false
    force_path_style: true
    public_url: "http://localhost:9000"
    create_bucket: true
    startup_timeout: 5s
